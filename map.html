": "eat", "name": "카페 리페 (Cafe Lipe)", "lat": 6.48679, "lon": 99.30365, "desc": "정원형 카페. 조식 세트, 과일 셰이크. 도착 직후 쉬어 가기 좋음", "review_url": "https://blog.naver.com/soo402473/221414801831", "review_title": "네이버 블로그 후기"}, {"cat": "eat", "name": "라니 시푸드 (Ranee Seafood)", "lat": null, "lon": null, "desc": "가성비 로컬. 팟타이가 섬 최고라는 평. 11:00~22:00", "review_url": "https://blog.naver.com/miaaa_r/223600592470", "review_title": "네이버 블로그 후기"}, {"cat": "eat", "name": "더 시즌 바이 더 클리프 (The Season By The Cliff)", "lat": null, "lon": null, "desc": "서쪽 절벽 레스토랑. 노을 뷰, 로띠 칭찬이 많음", "review_url": "https://blog.naver.com/csjkht/224469997192", "review_title": "네이버 블로그 후기"}, {"cat": "eat", "name": "타이덤 (Thaidurm)", "lat": null, "lon": null, "desc": "한국인 후기가 많은 집. 푸팟퐁커리, 팟타이, 과일 스무디", "review_url": "https://blog.naver.com/kksy412/223363728964", "review_title": "네이버 블로그 후기"}, {"cat": "eat", "name": "모조 카페 (Mojo Cafe)", "lat": null, "lon": null, "desc": "커피가 맛있는 브런치 카페. 샌드위치, 샐러드", "review_url": "https://blog.naver.com/chaewonyo/224094447817", "review_title": "네이버 블로그 후기"}, {"cat": "eat", "name": "코코넛 풀빵 노점 (세븐일레븐 앞)", "lat": null, "lon": null, "desc": "한 개 10바트. 아이 간식으로 강추", "review_url": "https://blog.naver.com/chaewonyo/224075095065", "review_title": "네이버 블로그 후기"}] },
};

const map = L.map("map");
// OSM 공식 타일은 file://에서 403, CARTO는 API 키 요구 → 키 없이 되는 Esri 타일 사용
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Tiles © Esri"
}).addTo(map);

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const gmapsUrl = (p) => p.lat != null
  ? `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`
  : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name.replace(/^.*\(|\).*$/g, "") + (p.region === "lgk" ? " Langkawi" : " Koh Lipe"))}`;
const linksHtml = (p) =>
  `<div class="links"><a class="gm" href="${gmapsUrl(p)}" target="_blank">🗺️ 구글맵</a>` +
  (p.review_url ? `<a class="rv" href="${esc(p.review_url)}" target="_blank">📝 ${esc(p.review_title || "블로그 후기")}</a>` : "") +
  `</div>`;

for (const [key, region] of Object.entries(PLACES)) {
  for (const p of region.items) {
    p.region = key;
    if (p.lat == null) continue;
    p.marker = L.circleMarker([p.lat, p.lon], { radius: 8, color: "#fff", weight: 2, fillColor: COLORS[p.cat], fillOpacity: 0.95 })
      .bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.desc)}${linksHtml(p)}`)
      .addTo(map);
  }
}

function show(key) {
  const region = PLACES[key];
  document.getElementById("b-lgk").classList.toggle("on", key === "lgk");
  document.getElementById("b-lipe").classList.toggle("on", key === "lipe");
  map.fitBounds(region.view);
  let html = "";
  for (const cat of ["hotel", "ferry", "see", "eat"]) {
    const rows = region.items.map((p, i) => [p, i]).filter(([p]) => p.cat === cat);
    if (!rows.length) continue;
    html += `<h2>${CAT_LABEL[cat]} (${rows.length})</h2>`;
    for (const [p, i] of rows) {
      const pinned = p.lat != null;
      html += `<div class="item${pinned ? " pinned" : ""}" data-i="${i}"><i class="dot" style="background:${COLORS[cat]}"></i><b>${esc(p.name)}</b>` +
        (pinned ? "" : ` <span class="nopin">(지도 위치 미확인)</span>`) +
        `<div class="desc">${esc(p.desc)}</div>${linksHtml(p)}</div>`;
    }
  }
  const list = document.getElementById("list");
  list.innerHTML = html;
  list.querySelectorAll(".item.pinned").forEach((el) => el.addEventListener("click", (e) => {
    if (e.target.closest("a")) return;  // 링크 클릭은 그대로 열기
    const p = region.items[+el.dataset.i];
    map.setView(p.marker.getLatLng(), 16);
    p.marker.openPopup();
  }));
}

document.getElementById("b-lgk").onclick = () => show("lgk");
document.getElementById("b-lipe").onclick = () => show("lipe");
show("lgk");
</script>
