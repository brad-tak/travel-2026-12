  [/케이블카|스카이캡|SkyCab|Cable/i, "🚡"], [/폭포|Waterfall|Telaga|Wells/i, "💦"], [/짚라인|Zipline|스카이트렉|Skytrex|로프/i, "🧗"],
  [/ATV|산악|버기|Buggy/i, "🏍️"], [/승마|Horse/i, "🐎"], [/제트스키|Jet ?Ski|패러세일|Parasail|바나나/i, "🏄"],
  [/낚시|Fishing/i, "🎣"], [/고카트|Kart/i, "🏎️"], [/논|Padi|Paddy|라만 파디/i, "🌾"], [/무덤|Mahsuri|박물관|Museum|갤러리|Galeria/i, "🏛️"],
  [/바틱|Batik|공예|Craft/i, "🎨"], [/전망|Viewpoint|Gunung|산/i, "⛰️"], [/해변|비치|Beach|Pantai|Tanjung Rhu/i, "🏖️"],
  [/공원|Park|광장|Square/i, "🌳"], [/카페|Cafe|Coffee|브런치/i, "☕"], [/사테|Satay/i, "🍢"],
  [/해산물|Seafood|시푸드|크랩|Crab|이칸|Ikan|피시|Fish/i, "🦐"], [/타이|Thai/i, "🍜"],
];
const CAT_ICON = { hotel: "🏨", ferry: "⛴️", see: "📍", act: "🎢", eat: "🍽️" };
function iconFor(p) {
  if (p.icon) return p.icon;
  const rule = ICON_RULES.find(([re]) => re.test(p.name));
  return rule ? rule[1] : CAT_ICON[p.cat];
}

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 구글맵은 좌표로 열면 핀만 보이고 사진·리뷰가 없음 → 장소 이름으로 검색해 장소 페이지를 연다.
// 검색어: p.gq(직접 지정) > 이름 괄호 안 영문명 + " Langkawi". 영문명이 없으면 좌표로 대체
function placeQuery(p) {
  if (p.gq) return p.gq;
  const en = (p.name.match(/\(([^)]*[A-Za-z][^)]*)\)/) || [])[1];
  if (en) return `${en.split(",")[0].trim()}, Langkawi`;
  return p.lat != null ? `${p.lat},${p.lon}` : `${p.name} Langkawi`;
}
const gmapsUrl = (p) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(placeQuery(p))}`;
const WALK_MAX_MIN = 30;  // 이보다 오래 걸으면 차 이용 권장
const mins = (s) => Math.max(1, Math.round(s / 60));
const fmtMin = (m) => m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ""}` : `${m}분`;
const fmtKm = (m) => m < 1000 ? `${m}m` : `${(m / 1000).toFixed(1)}km`;
const walkable = (p) => p.routes?.foot && mins(p.routes.foot.s) <= WALK_MAX_MIN;

// 숙소 → 장소 이동 시간 (build.py가 OSM 경로로 미리 계산)
function travelHtml(p) {
  if (p.cat === "hotel") return "";
  if (p.transport) return `<div class="travel">${esc(p.transport)}</div>`;
  if (!p.routes) return "";
  const { foot, car } = p.routes;
  const parts = [];
  const hideFoot = car && mins(foot?.s ?? 0) > 60;  // 걸어갈 거리가 아니면 차만 표시
  if (foot && !hideFoot) parts.push(`🚶 도보 ${fmtMin(mins(foot.s))} (${fmtKm(foot.m)})` + (car && !walkable(p) ? " · 차 권장" : ""));
  if (car) parts.push(`🚗 차 ${fmtMin(mins(car.s))}`);
  return parts.length ? `<div class="travel">${parts.join("  ·  ")}</div>` : "";
}

function dirUrl(p) {
  const hotel = PLACES[p.region].hotel;
  const mode = walkable(p) ? "walking" : "driving";
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(placeQuery(hotel))}` +
    `&destination=${encodeURIComponent(placeQuery(p))}&travelmode=${mode}`;
}

const linksHtml = (p) =>
  `<div class="links"><a class="gm" href="${gmapsUrl(p)}" target="_blank">🗺️ 구글맵</a>` +
  (p.cat !== "hotel" && !p.transport ? `<a class="dir" href="${dirUrl(p)}" target="_blank">🧭 숙소에서 길찾기</a>` : "") +
  (p.review_url ? `<a class="rv" href="${esc(p.review_url)}" target="_blank">📝 ${esc(p.review_title || "블로그 후기")}</a>` : "") +
  `</div>`;

for (const [key, region] of Object.entries(PLACES)) {
  region.hotel = region.items.find((p) => p.cat === "hotel");
  for (const p of region.items) p.region = key;
  for (const p of region.items) {
    if (p.lat == null) continue;
    const size = p.cat === "hotel" ? 40 : 34;
    p.marker = L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "", iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2],
        html: `<div class="emoji-pin ${p.cat}" style="--c:${COLORS[p.cat]};width:${size - 4}px;height:${size - 4}px">${iconFor(p)}</div>` }),
        zIndexOffset: p.cat === "hotel" ? 1000 : 0 })
      .bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.desc)}${travelHtml(p)}${linksHtml(p)}`)
      .addTo(map);
  }
}

function show(key) {
  const region = PLACES[key];
  map.fitBounds(region.view);
  let html = "";
  for (const cat of ["hotel", "ferry", "act", "see", "eat"]) {
    const rows = region.items.map((p, i) => [p, i]).filter(([p]) => p.cat === cat);
    if (!rows.length) continue;
    html += `<h2>${CAT_LABEL[cat]} (${rows.length})</h2>`;
    for (const [p, i] of rows) {
      const pinned = p.lat != null;
      html += `<div class="item${pinned ? " pinned" : ""}" data-i="${i}"><span class="ico">${iconFor(p)}</span><b>${esc(p.name)}</b>` +
        (pinned ? "" : ` <span class="nopin">(지도 위치 미확인)</span>`) +
        `<div class="desc">${esc(p.desc)}</div>${travelHtml(p)}${linksHtml(p)}</div>`;
    }
  }
  const list = document.getElementById("list");
  list.innerHTML = html;
  list.querySelectorAll(".item.pinned").forEach((el) => el.addEventListener("click", (e) => {
    if (e.target.closest("a")) return;  // 링크 클릭은 그대로 열기
    const p = region.items[+el.dataset.i];
    map.setView(p.marker.getLatLng(), 16);
    p.marker.openPopup();
  }));
}

show("lgk");
</script>
</body>
</html>
