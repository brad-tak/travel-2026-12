<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랑카위 · 꼬리페 여행 지도 (2026.12.15~19)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; display: flex; height: 100vh; }
  #side { width: 380px; overflow-y: auto; border-right: 1px solid #ddd; padding: 12px; font-size: 13px; }
  #map { flex: 1; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #eee; }
  .btns button { margin: 0 4px 8px 0; padding: 6px 10px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
  .btns button.on { background: #222; color: #fff; }
  .item { padding: 6px 4px; border-radius: 4px; }
  .item.pinned { cursor: pointer; }
  .item.pinned:hover { background: #f3f3f3; }
  .ico { display: inline-block; width: 18px; margin-right: 4px; text-align: center; }
  .emoji-pin { font-size: 22px; line-height: 30px; text-align: center; background: #fff; border-radius: 50%;
               box-shadow: 0 1px 4px rgba(0,0,0,.35); border: 2px solid var(--c); }
  .emoji-pin.hotel { font-size: 26px; line-height: 36px; }
  .desc { color: #666; margin-left: 16px; }
  .links { margin: 3px 0 0 16px; }
  .links a { display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 10px; font-size: 12px; text-decoration: none; }
  .links a.gm { background: #e8f0fe; color: #1a56c4; }
  .links a.rv { background: #e6f6ea; color: #137333; }
  .links a.dir { background: #fff4e5; color: #b45309; }
  .travel { margin: 3px 0 0 16px; color: #333; font-size: 12px; font-weight: 600; }
  .leaflet-popup-content .travel { margin: 6px 0 0; }
  .legend { font-size: 12px; line-height: 1.8; }
  .legend span { margin-right: 8px; white-space: nowrap; }
  .nopin { color: #999; font-size: 11px; }
  .leaflet-popup-content .links { margin-left: 0; }
  /* 휴대폰: 지도를 위, 목록을 아래로 */
  @media (max-width: 700px) {
    body { flex-direction: column-reverse; }
    #map { flex: none; height: 50vh; }
    #side { width: 100%; flex: 1; border-right: none; border-top: 1px solid #ddd; }
  }
</style>
</head>
<body>
<div id="side">
  <h1>🌴 랑카위 여행 지도</h1>
  <div class="legend">
    <span>🏨 숙소</span> <span>🏖️ 해변</span> <span>🎢 액티비티</span> <span>🍽️ 식당</span> <span>☕ 카페</span> <span>🏮 야시장</span>
  </div>
  <div class="btns"><button id="b-walk">🚶 도보 15분 이내만 보기</button></div>
  <div id="walk-note" class="nopin" style="display:none">웨스틴 주변 길은 밤에 어둡다는 후기가 있어요. 해가 진 뒤에는 그랩을 권장합니다.</div>
  <div id="list"></div>
</div>
<div id="map"></div>
<script>
const COLORS = { hotel: "#d62728", see: "#1f77b4", act: "#2ca02c", eat: "#ff7f0e", ferry: "#7f7f7f" };
const CAT_LABEL = { hotel: "🏨 숙소", ferry: "⛴️ 선착장", see: "📍 가볼 만한 곳", act: "🎢 액티비티", eat: "🍽️ 식당" };

// 좌표: OpenStreetMap 기준. 해변·섬은 대표 지점. 데이터 원본은 data/*.json (build.py로 주입)
const PLACES = {
  lgk: { view: [[6.19, 99.66], [6.47, 99.91]], items: /*LGK*/ },
};

const map = L.map("map");
// OSM 공식 타일은 file://에서 403, CARTO는 API 키 요구 → 키 없이 되는 Esri 평면(음영 없는) 지도 + 영문 라벨
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
// 평면 지도는 16단계까지만 있음 → 17단계부터는 Esri 거리 지도로 전환.
// 이 지역 거리 지도 데이터는 17단계까지라 18~19단계는 17단계 이미지를 확대해서 보여줌(핀 간격이 넓어짐)
L.tileLayer(ESRI + "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, attribution: "Tiles © Esri" }).addTo(map);
L.tileLayer(ESRI + "World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { minZoom: 17, maxNativeZoom: 17, maxZoom: 19 }).addTo(map);
map.setMaxZoom(19);

// 장소 이름 키워드로 이모지 결정 (p.icon이 있으면 그것을 우선)
const ICON_RULES = [
  [/호텔|리조트|Westin/i, "🏨"], [/제티|Jetty|선착장|페리/i, "⛴️"], [/야시장|Night Market/i, "🏮"],
  [/악어|Crocodile/i, "🐊"], [/아쿠아리움|언더워터|Underwater|수족관/i, "🐠"], [/새|Bird|와일드라이프|Wildlife|동물/i, "🦜"],
  [/독수리|Eagle/i, "🦅"], [/맹그로브|Mangrove|킬림|Kilim|카약|Kayak/i, "🛶"], [/호핑|Hopping|섬 투어|크루즈|Cruise|요트|보트|Boat/i, "🚤"],
  [/케이블카|스카이캡|SkyCab|Cable/i, "🚡"], [/폭포|Waterfall|Telaga|Wells/i, "💦"], [/짚라인|Zipline|스카이트렉|Skytrex|로프/i, "🧗"],
  [/ATV|산악|버기|Buggy/i, "🏍️"], [/승마|Horse/i, "🐎"], [/제트스키|Jet ?Ski|패러세일|Parasail|바나나/i, "🏄"],
  [/낚시|Fishing/i, "🎣"], [/고카트|Kart/i, "🏎️"], [/논|Padi|Paddy|라만 파디/i, "🌾"], [/무덤|Mahsuri|박물관|Museum|갤러리|Galeria/i, "🏛️"],
  [/바틱|Batik|공예|Craft/i, "🎨"], [/전망|Viewpoint|Gunung|산/i, "⛰️"], [/해변|비치|Beach|Pantai|Tanjung Rhu/i, "🏖️"],
  [/공원|Park|광장|Square/i, "🌳"], [/카페|Cafe|Coffee|브런치/i, "☕"], [/사테|Satay/i, "🍢"],
  [/해산물|Seafood|시푸드|크랩|Crab|이칸|Ikan|피시|Fish/i, "🦐"], [/타이|Thai/i, "🍜"],
];
const CAT_ICON = { hotel: "🏨", ferry: "⛴️", see: "📍", act: "🎢", eat: "🍽️" };
function iconFor(p) {
  if (p.icon) return p.icon;
  const rule = ICON_RULES.find(([re]) => re.test(p.name));
  return rule ? rule[1] : CAT_ICON[p.cat];
}

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 구글맵은 좌표로 열면 핀만 보이고 사진·리뷰가 없음 → 장소 이름으로 검색해 장소 페이지를 연다.
// 검색어: p.gq(직접 지정) > 이름 괄호 안 영문명 + " Langkawi". 영문명이 없으면 좌표로 대체
function placeQuery(p) {
  if (p.gq) return p.gq;
  const en = (p.name.match(/\(([^)]*[A-Za-z][^)]*)\)/) || [])[1];
  if (en) return `${en.split(",")[0].trim()}, Langkawi`;
  return p.lat != null ? `${p.lat},${p.lon}` : `${p.name} Langkawi`;
}
const gmapsUrl = (p) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(placeQuery(p))}`;
const WALK_MAX_MIN = 30;  // 이보다 오래 걸으면 차 이용 권장
const WALK_SHORT_MIN = 15;  // "걸어서 갈 수 있는 곳" 기준
let walkOnly = false;
const mins = (s) => Math.max(1, Math.round(s / 60));
const fmtMin = (m) => m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ""}` : `${m}분`;
const fmtKm = (m) => m < 1000 ? `${m}m` : `${(m / 1000).toFixed(1)}km`;
const walkable = (p) => p.routes?.foot && mins(p.routes.foot.s) <= WALK_MAX_MIN;
const nearWalk = (p) => p.transport === "🏨 웨스틴 호텔 안" || (p.routes?.foot && mins(p.routes.foot.s) <= WALK_SHORT_MIN);

// 숙소 → 장소 이동 시간 (build.py가 OSM 경로로 미리 계산)
function travelHtml(p) {
  if (p.cat === "hotel") return "";
  if (p.transport) return `<div class="travel">${esc(p.transport)}</div>`;
  if (!p.routes) return "";
  const { foot, car } = p.routes;
  const parts = [];
  const hideFoot = car && mins(foot?.s ?? 0) > 60;  // 걸어갈 거리가 아니면 차만 표시
  if (foot && !hideFoot) parts.push(`${nearWalk(p) ? "✅ " : ""}🚶 도보 ${fmtMin(mins(foot.s))} (${fmtKm(foot.m)})` + (car && !walkable(p) ? " · 차 권장" : ""));
  if (car) parts.push(`🚗 차 ${fmtMin(mins(car.s))}`);
  return parts.length ? `<div class="travel">${parts.join("  ·  ")}</div>` : "";
}

function dirUrl(p) {
  const hotel = PLACES[p.region].hotel;
  const mode = walkable(p) ? "walking" : "driving";
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(placeQuery(hotel))}` +
    `&destination=${encodeURIComponent(placeQuery(p))}&travelmode=${mode}`;
}

const linksHtml = (p) =>
  `<div class="links"><a class="gm" href="${gmapsUrl(p)}" target="_blank">🗺️ 구글맵</a>` +
  (p.cat !== "hotel" && !p.transport ? `<a class="dir" href="${dirUrl(p)}" target="_blank">🧭 숙소에서 길찾기</a>` : "") +
  (p.review_url ? `<a class="rv" href="${esc(p.review_url)}" target="_blank">📝 ${esc(p.review_title || "블로그 후기")}</a>` : "") +
  `</div>`;

for (const [key, region] of Object.entries(PLACES)) {
  region.hotel = region.items.find((p) => p.cat === "hotel");
  for (const p of region.items) p.region = key;
  for (const p of region.items) {
    if (p.lat == null) continue;
    const size = p.cat === "hotel" ? 40 : 34;
    p.marker = L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "", iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2],
        html: `<div class="emoji-pin ${p.cat}" style="--c:${COLORS[p.cat]};width:${size - 4}px;height:${size - 4}px">${iconFor(p)}</div>` }),
        zIndexOffset: p.cat === "hotel" ? 1000 : 0 })
      .bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.desc)}${travelHtml(p)}${linksHtml(p)}`)
      .addTo(map);
  }
}

function show(key) {
  const region = PLACES[key];
  map.fitBounds(region.view);
  let html = "";
  for (const cat of ["hotel", "ferry", "act", "see", "eat"]) {
    const rows = region.items.map((p, i) => [p, i]).filter(([p]) => p.cat === cat && (!walkOnly || cat === "hotel" || nearWalk(p)));
    if (!rows.length) continue;
    html += `<h2>${CAT_LABEL[cat]} (${rows.length})</h2>`;
    for (const [p, i] of rows) {
      const pinned = p.lat != null;
      html += `<div class="item${pinned ? " pinned" : ""}" data-i="${i}"><span class="ico">${iconFor(p)}</span><b>${esc(p.name)}</b>` +
        (pinned ? "" : ` <span class="nopin">(지도 위치 미확인)</span>`) +
        `<div class="desc">${esc(p.desc)}</div>${travelHtml(p)}${linksHtml(p)}</div>`;
    }
  }
  const list = document.getElementById("list");
  list.innerHTML = html;
  list.querySelectorAll(".item.pinned").forEach((el) => el.addEventListener("click", (e) => {
    if (e.target.closest("a")) return;  // 링크 클릭은 그대로 열기
    const p = region.items[+el.dataset.i];
    map.setView(p.marker.getLatLng(), 18);
    p.marker.openPopup();
  }));
}

document.getElementById("b-walk").onclick = (e) => {
  walkOnly = !walkOnly;
  e.target.classList.toggle("on", walkOnly);
  document.getElementById("walk-note").style.display = walkOnly ? "block" : "none";
  for (const p of PLACES.lgk.items) {
    if (!p.marker) continue;
    const visible = !walkOnly || p.cat === "hotel" || nearWalk(p);
    visible ? p.marker.addTo(map) : p.marker.remove();
  }
  show("lgk");
  if (walkOnly) map.setView([PLACES.lgk.hotel.lat, PLACES.lgk.hotel.lon], 15);
};
show("lgk");
</script>
</body>
</html>
